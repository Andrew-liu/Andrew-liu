name: Update latest blog posts

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/blog-posts.yml"]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull latest posts from blog feed
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://blog.dinosaurliu.com/atom.xml"
          max_post_count: 5
          date_format: "yyyy-mm-dd"
          template: "- [$title]($url) — $date $newline"
          commit_message: "chore: update latest blog posts"
