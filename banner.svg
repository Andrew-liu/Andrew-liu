<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Andrew Liu — Backend Engineer, Building AI Agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>
    <linearGradient id="scanline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7aa2f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="220" rx="16"/></clipPath>
  </defs>
  <style>
    .flowline { animation: flow 6s linear infinite; }
    @keyframes flow { 0% { transform: translateX(-400px); } 100% { transform: translateX(400px); } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    .pulse1 { animation: pulse 3.6s ease-in-out infinite; transform-origin: 90px 40px; }
    .pulse2 { animation: pulse 4.4s ease-in-out 1.2s infinite; transform-origin: 1130px 190px; }
    .pulse3 { animation: pulse 5s ease-in-out 0.6s infinite; transform-origin: 1010px 30px; }
    @keyframes pulse { 0%, 100% { opacity: 0.05; transform: scale(1); } 50% { opacity: 0.14; transform: scale(1.08); } }
    .scan { animation: scan 9s linear infinite; }
    @keyframes scan { 0% { transform: translateX(-1300px); } 100% { transform: translateX(1300px); } }
    .brace1 { animation: float 6s ease-in-out infinite; }
    .brace2 { animation: float 7s ease-in-out 1.5s infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="220" fill="url(#bg)"/>
    <circle class="pulse1" cx="90" cy="40" r="130" fill="#7aa2f7"/>
    <circle class="pulse2" cx="1130" cy="190" r="150" fill="#bb9af7"/>
    <circle class="pulse3" cx="1010" cy="30" r="60" fill="#7dcfff"/>
    <rect class="scan" x="0" y="0" width="260" height="220" fill="url(#scanline)"/>
    <g class="brace1"><text x="150" y="56" font-family="'Fira Code','Cascadia Code',Consolas,monospace" font-size="22" fill="#414868">{ }</text></g>
    <g class="brace2"><text x="1030" y="200" font-family="'Fira Code','Cascadia Code',Consolas,monospace" font-size="22" fill="#414868">&lt;/&gt;</text></g>
    <text x="600" y="100" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="56" font-weight="700" fill="#c0caf5">Andrew Liu</text>
    <text x="592" y="145" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="22" fill="#7aa2f7">Backend Engineer · C++ / Go / Python · Building AI Agents</text>
    <rect class="cursor" x="962" y="128" width="11" height="20" fill="#7dcfff"/>
    <g clip-path="url(#frame)">
      <rect class="flowline" x="400" y="168" width="400" height="4" rx="2" fill="url(#accent)"/>
    </g>
  </g>
</svg>
